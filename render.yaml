services:
  - type: web
    name: hostelshare-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false # Set in Render Dashboard with Supabase Postgres connection pooler string
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a cryptographically secure random string
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: ALLOWED_ORIGINS
        sync: false # Set to your Vercel URL, e.g. https://your-frontend.vercel.app
      - key: SUPABASE_URL
        sync: false # https://<project-ref>.supabase.co
      - key: SUPABASE_KEY
        sync: false # Use the Supabase service_role key to bypass RLS on storage upload
      - key: SUPABASE_BUCKET
        value: hostelshare-media
      - key: DEV_MOCK_OTP
        value: "123456"
      - key: BREVO_API_KEY
        sync: false # Set in Render Dashboard with your Brevo API Key (xkeysib-...)
      - key: BREVO_SENDER_EMAIL
        sync: false # Set in Render Dashboard with your verified sender email (e.g. yourname@gmail.com)
      - key: BREVO_SENDER_NAME
        value: "HostelShare"
